<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VtM 5e Character Creator</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #eee; padding: 20px; }
        .dot-track { display: flex; gap: 5px; cursor: pointer; margin-bottom: 10px; }
        .dot { width: 15px; height: 15px; border-radius: 50%; border: 1px solid #c00; background: transparent; }
        .dot.filled { background: #c00; }
        #message-box { color: #ff4444; min-height: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="app-container">
        <h1>VtM 5e: Генератор Персонажа</h1>
        <div id="message-box"></div>

        <div id="concept-container" style="margin-bottom: 20px; padding: 10px; border: 1px solid #444;">
            <h3>Концепт</h3>
            <label for="clan-select">Клан:</label>
            <select id="clan-select">
                <option value="">-- Оберіть клан --</option>
            </select>
        </div>

        <div id="attributes-container">
            <h3>Атрибути</h3>
            <!-- Оновлені data-атрибути -->
            <div class="attribute-row">
                <span>Міць (Strength)</span>
                <div class="dot-track">
                    <div class="dot filled" data-category="attributes" data-trait="strength" data-value="1"></div>
                    <div class="dot" data-category="attributes" data-trait="strength" data-value="2"></div>
                    <div class="dot" data-category="attributes" data-trait="strength" data-value="3"></div>
                    <div class="dot" data-category="attributes" data-trait="strength" data-value="4"></div>
                    <div class="dot" data-category="attributes" data-trait="strength" data-value="5"></div>
                </div>
            </div>
            <!-- Сюди можна додати інші атрибути за аналогією -->
        </div>

        <div id="disciplines-container" style="margin-top: 20px;">
            <h3>Дисципліни (Disciplines)</h3>
            <div id="disciplines-list">
                <!-- Сюди будуть генеруватися дисципліни клану -->
                <p style="color: #888; font-size: 0.9em;">Оберіть клан, щоб побачити доступні дисципліни.</p>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
